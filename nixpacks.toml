[variables]
NODE_VERSION = "22"
# devDependencies (vite, tsc, esbuild) are REQUIRED to build.
# NODE_ENV=production would make pnpm skip them, so force-install everything:
NPM_CONFIG_PRODUCTION = "false"

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@9.15.4 --activate",
  "pnpm install --no-frozen-lockfile --prod=false"
]

[phases.build]
cmds = [
  "pnpm --filter @workspace/api-server build",
  "pnpm --filter future-jaano build"
]

[start]
cmd = "pnpm --filter @workspace/db run push-force || echo 'db push skipped'; node --enable-source-maps artifacts/api-server/dist/index.mjs"
