openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Future Jaano - AI-powered spiritual guidance platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: horoscope
    description: Daily horoscope operations
  - name: kundli
    description: Birth chart / Kundli operations
  - name: problem-solver
    description: AI-powered problem solving
  - name: vastu
    description: Vastu Shastra analysis
  - name: palm-reading
    description: Palm reading analysis
  - name: face-reading
    description: Face reading analysis
  - name: numerology
    description: Numerology reports
  - name: yoga
    description: Yoga and meditation suggestions
  - name: blog
    description: Blog and content management
  - name: subscription
    description: Premium subscription management
  - name: payment
    description: Payment operations
  - name: admin
    description: Admin dashboard operations
  - name: user
    description: User profile operations
  - name: notification
    description: Push notifications
  - name: panchang
    description: Daily Panchang
  - name: gochar
    description: Planetary transits / Gochar
  - name: kundli-milan
    description: Kundli compatibility matching
  - name: dasha
    description: Vimshottari Dasha calculator
  - name: muhurat
    description: Muhurat / auspicious timing
  - name: ashtakavarga
    description: Ashtakavarga planetary strength
paths:
  # PANCHANG
  /panchang:
    get:
      operationId: getPanchang
      tags: [panchang]
      summary: Get today's Panchang
      parameters:
        - in: query
          name: date
          schema: { type: string }
          description: Date in YYYY-MM-DD format (defaults to today)
      responses:
        "200":
          description: Panchang data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PanchangData" }

  # GOCHAR
  /gochar:
    get:
      operationId: getGochar
      tags: [gochar]
      summary: Get today's planetary positions (Gochar)
      parameters:
        - in: query
          name: language
          schema: { type: string }
      responses:
        "200":
          description: Gochar data
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GocharData" }

  # KUNDLI MILAN
  /kundli-milan:
    post:
      operationId: createKundliMilan
      tags: [kundli-milan]
      summary: Match two Kundlis for compatibility
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/KundliMilanRequest" }
      responses:
        "201":
          description: Kundli Milan report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KundliMilanReport" }
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  # DASHA
  /dasha:
    post:
      operationId: createDashaReport
      tags: [dasha]
      summary: Calculate Vimshottari Dasha
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DashaRequest" }
      responses:
        "201":
          description: Dasha report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashaReport" }
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  # MUHURAT
  /muhurat:
    post:
      operationId: createMuhurat
      tags: [muhurat]
      summary: Calculate auspicious Muhurat
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MuhuratRequest" }
      responses:
        "201":
          description: Muhurat report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MuhuratReport" }
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  # ASHTAKAVARGA
  /ashtakavarga:
    post:
      operationId: createAshtakavarga
      tags: [ashtakavarga]
      summary: Generate Ashtakavarga chart
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AshtakavargaRequest" }
      responses:
        "201":
          description: Ashtakavarga report
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AshtakavargaReport" }
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # USER PROFILE
  /users/me:
    get:
      operationId: getMyProfile
      tags: [user]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
    patch:
      operationId: updateMyProfile
      tags: [user]
      summary: Update current user profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserProfileUpdate"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"

  /users/me/dashboard:
    get:
      operationId: getUserDashboard
      tags: [user]
      summary: Get personalized dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /users/me/readings:
    get:
      operationId: getMyReadings
      tags: [user]
      summary: Get user's recent readings and reports
      responses:
        "200":
          description: List of readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReadingRecord"

  # HOROSCOPE
  /horoscope/daily:
    get:
      operationId: getDailyHoroscope
      tags: [horoscope]
      summary: Get daily horoscope for all zodiac signs
      parameters:
        - name: date
          in: query
          schema:
            type: string
          description: Date in YYYY-MM-DD format (defaults to today)
        - name: lang
          in: query
          schema:
            type: string
            enum: [en, hi]
          description: Language (en or hi)
      responses:
        "200":
          description: Daily horoscopes for all signs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HoroscopeEntry"

  /horoscope/daily/{sign}:
    get:
      operationId: getDailyHoroscopeBySign
      tags: [horoscope]
      summary: Get daily horoscope for a specific zodiac sign
      parameters:
        - name: sign
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Daily horoscope for the sign
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoroscopeEntry"

  /horoscope/weekly/{sign}:
    get:
      operationId: getWeeklyHoroscope
      tags: [horoscope]
      summary: Get weekly horoscope for a zodiac sign
      parameters:
        - name: sign
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Weekly horoscope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HoroscopeEntry"

  # KUNDLI
  /kundli:
    post:
      operationId: createKundli
      tags: [kundli]
      summary: Generate Kundli (birth chart) analysis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KundliInput"
      responses:
        "201":
          description: Generated Kundli
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KundliReport"

  /kundli/{id}:
    get:
      operationId: getKundli
      tags: [kundli]
      summary: Get a previously generated Kundli
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Kundli report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KundliReport"

  /kundli/my:
    get:
      operationId: getMyKundlis
      tags: [kundli]
      summary: Get all Kundlis for the current user
      responses:
        "200":
          description: List of Kundli reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KundliReport"

  # PROBLEM SOLVER
  /problems:
    post:
      operationId: submitProblem
      tags: [problem-solver]
      summary: Submit a problem for AI-powered remedy suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProblemInput"
      responses:
        "201":
          description: Problem submitted with AI remedies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSolution"

  /problems/{id}:
    get:
      operationId: getProblemSolution
      tags: [problem-solver]
      summary: Get a problem solution by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Problem solution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemSolution"

  /problems/my:
    get:
      operationId: getMyProblems
      tags: [problem-solver]
      summary: Get current user's problem history
      responses:
        "200":
          description: List of problem solutions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProblemSolution"

  # VASTU ANALYSIS
  /vastu/analyze:
    post:
      operationId: analyzeVastu
      tags: [vastu]
      summary: Analyze a photo for Vastu Shastra insights
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VastuInput"
      responses:
        "201":
          description: Vastu analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VastuReport"

  /vastu/{id}:
    get:
      operationId: getVastuReport
      tags: [vastu]
      summary: Get a Vastu analysis report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Vastu report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VastuReport"

  # PALM READING
  /palm/analyze:
    post:
      operationId: analyzePalm
      tags: [palm-reading]
      summary: Analyze a palm image for reading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageAnalysisInput"
      responses:
        "201":
          description: Palm reading result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PalmReport"

  /palm/{id}:
    get:
      operationId: getPalmReport
      tags: [palm-reading]
      summary: Get a palm reading report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Palm reading report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PalmReport"

  # FACE READING
  /face/analyze:
    post:
      operationId: analyzeFace
      tags: [face-reading]
      summary: Analyze a face image for reading
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImageAnalysisInput"
      responses:
        "201":
          description: Face reading result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceReport"

  /face/{id}:
    get:
      operationId: getFaceReport
      tags: [face-reading]
      summary: Get a face reading report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Face reading report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FaceReport"

  # NUMEROLOGY
  /numerology:
    post:
      operationId: createNumerologyReport
      tags: [numerology]
      summary: Generate a numerology report
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NumerologyInput"
      responses:
        "201":
          description: Numerology report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumerologyReport"

  /numerology/{id}:
    get:
      operationId: getNumerologyReport
      tags: [numerology]
      summary: Get a numerology report
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Numerology report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NumerologyReport"

  # YOGA & MEDITATION
  /yoga/suggestions:
    post:
      operationId: getYogaSuggestions
      tags: [yoga]
      summary: Get personalized yoga and meditation suggestions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/YogaInput"
      responses:
        "201":
          description: Yoga suggestions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/YogaPlan"

  /yoga/plans/my:
    get:
      operationId: getMyYogaPlans
      tags: [yoga]
      summary: Get user's yoga plans
      responses:
        "200":
          description: List of yoga plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/YogaPlan"

  # BLOG
  /blog/posts:
    get:
      operationId: getBlogPosts
      tags: [blog]
      summary: Get all published blog posts
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: lang
          in: query
          schema:
            type: string
            enum: [en, hi]
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Blog posts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPostList"
    post:
      operationId: createBlogPost
      tags: [blog]
      summary: Create a blog post (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostInput"
      responses:
        "201":
          description: Created blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"

  /blog/posts/trending:
    get:
      operationId: getTrendingBlogPosts
      tags: [blog]
      summary: Get trending blog posts
      responses:
        "200":
          description: Trending posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPost"

  /blog/posts/{slug}:
    get:
      operationId: getBlogPostBySlug
      tags: [blog]
      summary: Get a blog post by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
    patch:
      operationId: updateBlogPost
      tags: [blog]
      summary: Update a blog post (admin only)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogPostUpdate"
      responses:
        "200":
          description: Updated blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
    delete:
      operationId: deleteBlogPost
      tags: [blog]
      summary: Delete a blog post (admin only)
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted

  # SUBSCRIPTION
  /subscriptions/plans:
    get:
      operationId: getSubscriptionPlans
      tags: [subscription]
      summary: Get all subscription plans
      responses:
        "200":
          description: Subscription plans
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SubscriptionPlan"

  /subscriptions/my:
    get:
      operationId: getMySubscription
      tags: [subscription]
      summary: Get current user's subscription
      responses:
        "200":
          description: Current subscription
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSubscription"

  # PAYMENT
  /payments/initiate:
    post:
      operationId: initiatePayment
      tags: [payment]
      summary: Initiate a Razorpay payment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentInput"
      responses:
        "201":
          description: Payment order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"

  /payments/verify:
    post:
      operationId: verifyPayment
      tags: [payment]
      summary: Verify Razorpay payment signature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentVerification"
      responses:
        "200":
          description: Payment verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentResult"

  /payments/history:
    get:
      operationId: getPaymentHistory
      tags: [payment]
      summary: Get current user's payment history
      responses:
        "200":
          description: Payment history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PaymentRecord"

  # ADMIN DASHBOARD
  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get platform-wide statistics
      responses:
        "200":
          description: Admin statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/users:
    get:
      operationId: getAdminUsers
      tags: [admin]
      summary: Get all users (admin only)
      parameters:
        - name: page
          in: query
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: User list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"

  /admin/readings/recent:
    get:
      operationId: getRecentReadings
      tags: [admin]
      summary: Get recent readings across all users
      responses:
        "200":
          description: Recent readings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReadingRecord"

  /admin/revenue:
    get:
      operationId: getRevenueStats
      tags: [admin]
      summary: Get revenue statistics
      responses:
        "200":
          description: Revenue stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RevenueStats"

  # NOTIFICATIONS
  /notifications:
    get:
      operationId: getNotifications
      tags: [notification]
      summary: Get notifications for current user
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [notification]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationReadUpdate"
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"

  # WEB PUSH SUBSCRIPTIONS
  /push/vapid-public-key:
    get:
      operationId: getVapidPublicKey
      tags: [notification]
      summary: Get server's VAPID public key for push subscription
      responses:
        "200":
          description: VAPID public key
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VapidKey"

  /push/subscribe:
    post:
      operationId: subscribePush
      tags: [notification]
      summary: Register a web push subscription for the current user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushSubscribeRequest"
      responses:
        "200":
          description: Subscription saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionStatus"

  /push/unsubscribe:
    post:
      operationId: unsubscribePush
      tags: [notification]
      summary: Remove a web push subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushUnsubscribeRequest"
      responses:
        "200":
          description: Subscription removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionStatus"

  /push/preferences:
    patch:
      operationId: updatePushPreferences
      tags: [notification]
      summary: Update notification time / language preferences for an existing subscription
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushPreferencesUpdate"
      responses:
        "200":
          description: Preferences updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionStatus"

  /push/test:
    post:
      operationId: sendTestPush
      tags: [notification]
      summary: Send a test push to all active subscriptions of the current user
      responses:
        "200":
          description: Test push dispatched
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PushSubscriptionStatus"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    # USER
    UserProfile:
      type: object
      required: [id, clerkId, email, name, createdAt]
      properties:
        id: { type: integer }
        clerkId: { type: string }
        email: { type: string }
        name: { type: string }
        phone: { type: ["string", "null"] }
        dateOfBirth: { type: ["string", "null"] }
        timeOfBirth: { type: ["string", "null"] }
        placeOfBirth: { type: ["string", "null"] }
        gender: { type: ["string", "null"] }
        language: { type: string }
        isPremium: { type: boolean }
        avatarUrl: { type: ["string", "null"] }
        zodiacSign: { type: ["string", "null"] }
        createdAt: { type: string }

    UserProfileUpdate:
      type: object
      properties:
        name: { type: string }
        phone: { type: string }
        dateOfBirth: { type: string }
        timeOfBirth: { type: string }
        placeOfBirth: { type: string }
        gender: { type: string }
        language: { type: string }
        zodiacSign: { type: string }

    DashboardSummary:
      type: object
      required: [totalReadings, todayHoroscope, activeSubscription, recentActivity, zodiacSign]
      properties:
        totalReadings: { type: integer }
        todayHoroscope: { $ref: "#/components/schemas/HoroscopeEntry" }
        activeSubscription: { type: ["string", "null"] }
        recentActivity:
          type: array
          items:
            $ref: "#/components/schemas/ReadingRecord"
        zodiacSign: { type: ["string", "null"] }
