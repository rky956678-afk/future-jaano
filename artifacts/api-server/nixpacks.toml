[variables]
NODE_VERSION = "22"

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@9.15.4 --activate",
  "pnpm install --no-frozen-lockfile"
]

[phases.build]
cmds = ["pnpm --filter @workspace/api-server build"]

[start]
cmd = "node --enable-source-maps artifacts/api-server/dist/index.mjs"