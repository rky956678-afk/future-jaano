[variables]
NODE_VERSION = "22"

[phases.install]
cmds = [
  "corepack enable",
  "corepack prepare pnpm@9.15.4 --activate",
  "pnpm install --no-frozen-lockfile"
]

[phases.build]
cmds = ["pnpm --filter @workspace/mockup-sandbox build"]

[start]
cmd = "npx serve -s artifacts/mockup-sandbox/dist -l $PORT"
